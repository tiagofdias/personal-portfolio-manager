[package]
name = "personal-portfolio-manager"
version = "0.1.0"
edition = "2024"
description = "Lightweight native desktop app that analyses a portfolio described in percentages, profiles the investor and refines the plan with a free local AI."
license = "MIT OR Apache-2.0"

[dependencies]
# Native immediate-mode GUI (no webview). OpenGL backend only: smaller and lighter than wgpu.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tiny blocking HTTP client for the OpenAI-compatible endpoint (Ollama, llama.cpp, LM Studio...).
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
